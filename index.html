<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!--
      Ảnh hero là LCP của trang chủ nhưng chỉ lộ ra sau khi JS và chunk LandingPage tải xong.
      Tải trước ngay khi đọc HTML, và chỉ ở "/" để các portal không tải ảnh thừa.
    -->
    <script>
      if (location.pathname === '/') {
        var l = document.createElement('link')
        l.rel = 'preload'
        l.as = 'image'
        l.href = '/images/hero-960.webp'
        l.setAttribute('imagesrcset', '/images/hero-960.webp 960w, /images/hero-1672.webp 1672w')
        l.setAttribute('imagesizes', '100vw')
        l.setAttribute('fetchpriority', 'high')
        document.head.appendChild(l)
      }
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="description" content="Thi công điện mặt trời áp mái cho nhà xưởng, kho bãi và toà nhà: khảo sát tận mái, phương án riêng cho từng công trình, đội kỹ thuật của Smart Solar lắp đặt và bàn giao." />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="vi_VN" />
    <meta property="og:title" content="Smart Solar | Thi công điện mặt trời áp mái cho nhà xưởng và doanh nghiệp" />
    <meta property="og:description" content="Khảo sát tận mái, lên phương án riêng cho từng công trình, lắp đặt bằng đội kỹ thuật của Smart Solar và bàn giao hệ thống chạy ổn định." />
    <title>Smart Solar</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=block"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
