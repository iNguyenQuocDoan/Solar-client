<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 640" width="800" height="640">
  <defs>
    <linearGradient id="vsky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9dc0f2"/><stop offset="0.6" stop-color="#dce9ff"/><stop offset="1" stop-color="#eff4ff"/>
    </linearGradient>
    <linearGradient id="vroof" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#233144"/><stop offset="1" stop-color="#0d1c2e"/>
    </linearGradient>
  </defs>
  <rect width="800" height="640" fill="url(#vsky)"/>
  <circle cx="660" cy="110" r="56" fill="#fe932c" opacity="0.85"/>
  <circle cx="660" cy="110" r="96" fill="#ffb77d" opacity="0.25"/>
  <!-- distant tree line -->
  <g fill="#005d28" opacity="0.35">
    <circle cx="60" cy="330" r="60"/><circle cx="140" cy="350" r="48"/><circle cx="740" cy="340" r="56"/><circle cx="670" cy="360" r="40"/>
  </g>
  <!-- ground -->
  <rect y="470" width="800" height="170" fill="#75d789" opacity="0.5"/>
  <rect y="540" width="800" height="100" fill="#005d28" opacity="0.35"/>
  <!-- villa body -->
  <rect x="180" y="300" width="420" height="200" rx="6" fill="#eaf1ff"/>
  <rect x="180" y="300" width="130" height="200" rx="6" fill="#d5e3fc"/>
  <rect x="470" y="300" width="130" height="200" rx="6" fill="#bfc9c0" opacity="0.6"/>
  <!-- roof slab with panels -->
  <polygon points="150,300 390,190 630,300" fill="url(#vroof)"/>
  <g fill="#0d5c3a" opacity="0.95">
    <rect x="250" y="248" width="56" height="34" rx="3"/><rect x="312" y="248" width="56" height="34" rx="3"/>
    <rect x="374" y="248" width="56" height="34" rx="3"/><rect x="436" y="248" width="56" height="34" rx="3"/>
    <rect x="282" y="212" width="56" height="30" rx="3"/><rect x="344" y="212" width="56" height="30" rx="3"/>
    <rect x="406" y="212" width="56" height="30" rx="3"/>
  </g>
  <g stroke="#8ed6aa" stroke-width="1.2" opacity="0.7" fill="none">
    <path d="M278 248v34M340 248v34M402 248v34M464 248v34M310 212v30M372 212v30M434 212v30"/>
  </g>
  <!-- windows -->
  <g fill="#233144" opacity="0.85">
    <rect x="212" y="340" width="66" height="78" rx="4"/><rect x="330" y="340" width="96" height="78" rx="4"/>
    <rect x="470" y="340" width="66" height="78" rx="4"/>
  </g>
  <!-- garage door -->
  <rect x="330" y="440" width="96" height="60" rx="4" fill="#404942"/>
  <!-- hedges -->
  <g fill="#00431b" opacity="0.6">
    <ellipse cx="170" cy="500" rx="46" ry="26"/><ellipse cx="620" cy="502" rx="52" ry="28"/><ellipse cx="90" cy="516" rx="60" ry="30"/>
  </g>
  <!-- driveway -->
  <path d="M330 500 L 300 640 L 470 640 L 426 500 Z" fill="#bfc9c0" opacity="0.8"/>
